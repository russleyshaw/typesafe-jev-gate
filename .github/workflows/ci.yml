name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Run tests
        run: uv run pytest
      - name: Run Ruff
        run: uv run --with 'ruff>=0.16,<0.17' ruff check .
      - name: Run offline evaluation
        run: uv run python scripts/jev_report.py
